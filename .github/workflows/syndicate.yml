name: Syndicate

on:
  push:
    branches: [main]
    paths:
      - 'content/news/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Syndicate news posts
        run: bun run syndicate

      - name: Commit syndication state (if any)
        if: always()
        run: |
          if ! git diff --quiet -- scripts/syndicated.json; then
            git config user.name "tabelhahub-bot"
            git config user.email "noreply@github.com"
            git add scripts/syndicated.json
            git commit -m "chore: update syndication state"
            git push
          fi
